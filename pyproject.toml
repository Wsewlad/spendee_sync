[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spendee_sync"
version = "0.1.0"
description = "Sync Monobank (and Wise) transactions into Spendee with smart categorization, deduplication, and optional browser automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "selenium>=4.15",
    "webdriver-manager>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
include = ["spendee_sync*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
