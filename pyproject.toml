[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spendee-sync"
version = "0.1.0"
description = "Sync Monobank transactions to Spendee"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests",
    "tenacity",
    "python-dotenv",
    "pydantic",
    "pandas",
    "openpyxl",
    "selenium",
    "webdriver-manager",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "plyer>=2.1",
]

[project.scripts]
spendee-sync = "spendee_sync.cli:cli"
